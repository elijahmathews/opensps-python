name: CI

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main, 'dev/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13", "3.14", "3.15"]

    steps:
      - name: Check out opensps-python
        uses: actions/checkout@v7
        with:
          path: opensps-python

      - name: Check out libopensps
        uses: actions/checkout@v7
        with:
          repository: elijahmathews/libopensps
          ref: dev/c-api-batch-gradients
          path: libopensps

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran meson ninja-build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.2.0"

      - name: Build libopensps
        run: |
          cd libopensps
          meson setup build --buildtype=release -Dtests=true
          ninja -C build

      - name: Run Python unit tests
        env:
          OPENSPS_LIB: ${{ github.workspace }}/libopensps/build/src/libopensps.so
          OPENSPS_DATA_HOME: ${{ github.workspace }}/libopensps/tests/data/opensps-test-data
          PYTHONPATH: ${{ github.workspace }}/opensps-python/src
        run: |
          cd opensps-python
          python -m unittest discover -s tests
